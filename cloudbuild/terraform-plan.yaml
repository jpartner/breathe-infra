# Plan-only Terraform pipeline for breathe-infra.
#
# Runs `terraform plan` against multi-shared and multi-dev on every push to
# main. It never applies. Its job is to answer, within minutes of a commit,
# "what would this change, and has anything drifted out from under us?" — the
# question that previously only got asked when someone happened to run a plan
# on their laptop.
#
# WHAT MAKES THE BUILD RED
#
#   plan errors            -> red. Bad credentials, an expired Zitadel key
#                             (see docs §3 — the working key expires
#                             2026-11-30), unreachable state, HCL that does not
#                             validate.
#   any proposed destroy   -> red. This is the §1 trap: a missing or mistyped
#                             gating variable makes the plan propose deleting
#                             ~75 Zitadel resources, production orgs included.
#                             Nothing else in this repo warns you.
#   adds / updates only    -> GREEN, with the summary in the log.
#   no changes             -> green.
#
# Adds and updates are deliberately not failures. This repo carries standing
# drift by design — `gcloud run services update` changes, committed-but-not-yet
# -applied work — so failing on "plan is non-empty" would leave the build
# permanently red, and a permanently red build is one nobody reads.
#
# WHAT GETS REPORTED TO SLACK
#
# Red/green alone does not surface drift: something changed by hand shows up as
# an update, which is green, which means it sits in a log nobody opens. So the
# gate posts to Slack whenever it finds proposed destroys OR drift — and stays
# silent otherwise, because a message on every green run trains people to
# ignore the channel.
#
# "Drift" here means Terraform's resource_drift (state vs reality: someone
# changed something out of band), not resource_changes (config vs reality:
# work you have not applied yet). The two are conflated in the human-readable
# plan output and separate in the JSON.
#
# Drift is reported but does NOT fail the build. Knowing is the point; whether
# to reconcile or re-codify is a judgement call, not something CI should force.
# Raw drift is filtered hard — see the NOISE pattern in the gate step. On real
# data every one of the 11 raw entries was server-assigned churn (etag,
# generation, revision names); unfiltered, this would fire on every deploy.
#
# Plans run with -lock=false. A plan only reads state, and taking the lock would
# mean a long human apply turns this build red for no reason. The cost is that a
# plan captured mid-apply may be stale; the next push re-runs it.

timeout: 1800s

substitutions:
  # Project numbers for the environment projects, in the order multi-shared
  # expects. Source: docs/zitadel-and-terraform-variables.md §8.
  #
  # Referenced below as ${_ENV_PROJECT_NUMBERS} — a single $, so Cloud Build
  # substitutes it. Secret env vars use $$ instead, which escapes to a literal
  # $ and defers to the shell. Getting the two mixed up fails the build at
  # validation ("key ... is not matched in the template") rather than at run
  # time, which is the good outcome.
  _ENV_PROJECT_NUMBERS: '["815682864674","400245265670","375280996820"]'
  _TF_VERSION: '1.15.8'
  # Same channel the build notifier posts to.
  _SLACK_CHANNEL: 'C0BPQ4R7HC6'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

availableSecrets:
  secretManager:
    # NOTE: unifeed-zitadel-terraform-key, NOT zitadel-service-account-key.
    # The latter is the legacy Breathe-era key and fails with a generic
    # HTTP 500 Errors.Internal that reads like a broken server (docs §3).
    - versionName: projects/breathe-shared/secrets/unifeed-zitadel-terraform-key/versions/latest
      env: 'ZITADEL_KEY'
    - versionName: projects/breathe-shared/secrets/unifeed-cloudflare-api-token/versions/latest
      env: 'UNIFEED_CF_TOKEN'
    - versionName: projects/breathe-shared/secrets/cloudflare-api-token/versions/latest
      env: 'CF_TOKEN'
    - versionName: projects/breathe-shared/secrets/slack-bot-token/versions/latest
      env: 'SLACK_TOKEN'

steps:
  # ---------------------------------------------------------------------------
  # The Zitadel provider authenticates from a JSON key file on disk, so the
  # secret has to be materialised rather than passed as a variable.
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'materialise-zitadel-key'
    entrypoint: 'bash'
    secretEnv: ['ZITADEL_KEY']
    args:
      - '-c'
      - |
        set -euo pipefail
        umask 077
        printf '%s' "$$ZITADEL_KEY" > /workspace/zitadel-key.json
        # Fail early and legibly if the key is not valid JSON — an expired or
        # rotated secret otherwise surfaces as an opaque provider error deep in
        # the refresh.
        python3 -c "import json;json.load(open('/workspace/zitadel-key.json'))"
        echo "Zitadel key materialised ($(wc -c < /workspace/zitadel-key.json) bytes)"

  - name: 'hashicorp/terraform:${_TF_VERSION}'
    id: 'plan-multi-shared'
    entrypoint: 'sh'
    secretEnv: ['UNIFEED_CF_TOKEN', 'CF_TOKEN']
    args:
      - '-c'
      - |
        set -eu
        cd environments/multi-shared
        terraform init -input=false -no-color
        # unifeed_zitadel_manage_config is passed explicitly even though it now
        # defaults to true: the §1 trap was a *partial* invocation, and being
        # explicit here means the pipeline cannot drift into that shape.
        terraform plan -input=false -no-color -lock=false \
          -out=/workspace/multi-shared.tfplan \
          -var 'environment_project_numbers=${_ENV_PROJECT_NUMBERS}' \
          -var 'unifeed_zitadel_manage_config=true' \
          -var 'unifeed_zitadel_key_path=/workspace/zitadel-key.json' \
          -var "unifeed_cloudflare_api_token=$$UNIFEED_CF_TOKEN" \
          -var "cloudflare_api_token=$$CF_TOKEN"
        terraform show -json /workspace/multi-shared.tfplan > /workspace/multi-shared.json

  - name: 'hashicorp/terraform:${_TF_VERSION}'
    id: 'plan-multi-dev'
    entrypoint: 'sh'
    secretEnv: ['UNIFEED_CF_TOKEN', 'CF_TOKEN']
    args:
      - '-c'
      - |
        set -eu
        cd environments/multi-dev
        terraform init -input=false -no-color
        # multi-dev's only two variables without defaults. terraform.tfvars is
        # gitignored and terraform.tfvars.example is stale (it names breathe-db;
        # the live instance is breathe-multi-db), so these are passed directly.
        terraform plan -input=false -no-color -lock=false \
          -out=/workspace/multi-dev.tfplan \
          -var 'vpc_connector_id=projects/breathe-shared/locations/europe-west2/connectors/breathe-vpc-connector' \
          -var 'db_connection_name=breathe-shared:europe-west2:breathe-multi-db' \
          -var "unifeed_cloudflare_api_token=$$UNIFEED_CF_TOKEN" \
          -var "cloudflare_api_token=$$CF_TOKEN"
        terraform show -json /workspace/multi-dev.tfplan > /workspace/multi-dev.json

  # ---------------------------------------------------------------------------
  # The gate. Summarise both plans and fail only on proposed destroys.
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'gate-and-report'
    entrypoint: 'python3'
    secretEnv: ['SLACK_TOKEN']
    env:
      - 'SLACK_CHANNEL=${_SLACK_CHANNEL}'
    args:
      - '-c'
      - |
        import json, os, re, sys, urllib.request

        # Attributes GCP assigns itself. They differ on every deploy and mean
        # nothing about whether a human changed something out of band. Without
        # this filter every deploy reports 7 "drifted" services and the report
        # becomes noise nobody reads — which is the failure mode this is meant
        # to fix, not reproduce.
        #
        # template.containers.image is in here deliberately: CI moves image tags
        # on every deploy and the services carry lifecycle ignore_changes on it
        # precisely so Terraform tolerates that. Reporting it would flag the
        # intended design as drift.
        NOISE = re.compile(r"""^(
            etag | uid | generation | observed_generation
          | create_time | update_time | delete_time | expire_time
          | last_modifier | reconciling | launch_stage
          | latest_created_revision | latest_ready_revision
          | conditions\[\] .* | terminal_condition\[\] .*
          | traffic\[\] .* | traffic_statuses\[\] .*
          | effective_labels .* | terraform_labels .*
          | template\[\]\.containers\[\]\.image
            # Cloud Run's record of which tool last wrote the service. Every
            # deploy here is `gcloud run services update`, so it always reads
            # "gcloud" — a fact about the deploy model, not a change anyone made.
          | client | client_version
            # Cloud SQL's optimistic-concurrency counter. It increments on any
            # settings write, including Google's own maintenance activity, and
            # carries no information about what changed. Checked against the
            # live instance: it moved 69 -> 70 with no other attribute differing.
            # NOT filtered, deliberately: maintenance_version (Google's minor
            # version patches, worth knowing about) and disk_size.
          | settings\[\]\.version
        )$""", re.X)

        def flatten(value, prefix=""):
            out = {}
            if isinstance(value, dict):
                for k, v in value.items():
                    out.update(flatten(v, prefix + "." + k if prefix else k))
            elif isinstance(value, list):
                for i, v in enumerate(value):
                    out.update(flatten(v, "%s[%d]" % (prefix, i)))
            else:
                out[prefix] = value
            return out

        def meaningful_drift(entry):
            """Attribute paths that changed and are not server-assigned."""
            change = entry.get("change", {})
            before = flatten(change.get("before") or {})
            after = flatten(change.get("after") or {})
            changed = set()
            for key in set(before) | set(after):
                if before.get(key) == after.get(key):
                    continue
                normalised = re.sub(r"\[\d+\]", "[]", key)
                if not NOISE.match(normalised):
                    changed.add(normalised)
            return sorted(changed)

        destroys, drifted, summary = [], [], []

        for env in ("multi-shared", "multi-dev"):
            with open("/workspace/%s.json" % env) as fh:
                plan = json.load(fh)

            counts = {"create": 0, "update": 0, "delete": 0, "replace": 0}
            for rc in plan.get("resource_changes", []):
                actions = rc.get("change", {}).get("actions", [])
                if actions == ["create"]:
                    counts["create"] += 1
                elif actions == ["update"]:
                    counts["update"] += 1
                elif actions == ["delete"]:
                    counts["delete"] += 1
                    destroys.append("%s: %s" % (env, rc["address"]))
                elif "delete" in actions and "create" in actions:
                    counts["replace"] += 1
                    destroys.append("%s: %s (replace)" % (env, rc["address"]))

            env_drift = []
            for entry in plan.get("resource_drift", []):
                attrs = meaningful_drift(entry)
                if attrs:
                    env_drift.append((entry["address"], attrs))
                    drifted.append("%s: %s — %s"
                                   % (env, entry["address"], ", ".join(attrs[:4])))

            raw = len(plan.get("resource_drift", []))
            print("%s: +%d ~%d -%d replace:%d  |  drift %d of %d raw entries"
                  % (env, counts["create"], counts["update"], counts["delete"],
                     counts["replace"], len(env_drift), raw))
            summary.append("*%s* +%d ~%d -%d  ·  drift %d"
                           % (env, counts["create"], counts["update"],
                              counts["delete"], len(env_drift)))

            for address, attrs in env_drift:
                print("    DRIFT %s" % address)
                for attr in attrs:
                    print("            %s" % attr)

        if destroys:
            print("\n%d resource(s) would be destroyed:" % len(destroys))
            for item in destroys:
                print("    - " + item)
            if any(".unifeed_zitadel_config" in d for d in destroys):
                print("  !! Destroys under module.unifeed_zitadel_config are the")
                print("     signature of a missing or mistyped gating variable,")
                print("     not a real change. See docs §1 before applying.")

        # Slack gets a message only when there is something to act on. A post on
        # every green run trains people to ignore the channel.
        if destroys or drifted:
            lines = []
            if destroys:
                lines.append(":warning: *terraform plan proposes destroying %d resource(s)*"
                             % len(destroys))
                lines += ["    • " + d for d in destroys[:10]]
            if drifted:
                lines.append(":mag: *infrastructure changed outside Terraform* (%d)"
                             % len(drifted))
                lines += ["    • " + d for d in drifted[:10]]
            lines.append("  ·  ".join(summary))

            body = json.dumps({
                "channel": os.environ["SLACK_CHANNEL"],
                "text": "\n".join(lines),
                "unfurl_links": False,
                "unfurl_media": False,
            }).encode("utf-8")
            request = urllib.request.Request(
                "https://slack.com/api/chat.postMessage", data=body,
                headers={"Authorization": "Bearer " + os.environ["SLACK_TOKEN"],
                         "Content-Type": "application/json; charset=utf-8"})
            with urllib.request.urlopen(request, timeout=10) as response:
                result = json.load(response)
            if not result.get("ok"):
                print("WARNING: Slack post failed: %s" % result.get("error"))

        if destroys:
            print("\nFAILED: this plan proposes destroying resources.")
            sys.exit(1)
        print("\nOK: no destroys proposed.")

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'shred-key'
    entrypoint: 'bash'
    args: ['-c', 'shred -u /workspace/zitadel-key.json 2>/dev/null || rm -f /workspace/zitadel-key.json; echo done']

# Deliberately no `artifacts:` block. `terraform show -json` embeds the values
# of sensitive attributes, and 15 google_secret_manager_secret_version resources
# are Terraform-managed in multi-shared — so persisting the plan JSON would
# write secret material to durable storage. The plan files stay in the build
# workspace and die with it; the log summary is what survives.
