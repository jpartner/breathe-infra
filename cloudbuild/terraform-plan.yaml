# Plan-only Terraform pipeline for breathe-infra.
#
# Runs `terraform plan` against multi-shared and multi-dev on every push to
# main. It never applies. Its job is to answer, within minutes of a commit,
# "what would this change, and has anything drifted out from under us?" — the
# question that previously only got asked when someone happened to run a plan
# on their laptop.
#
# WHAT MAKES THE BUILD RED
#
#   plan errors            -> red. Bad credentials, an expired Zitadel key
#                             (see docs §3 — the working key expires
#                             2026-11-30), unreachable state, HCL that does not
#                             validate.
#   any proposed destroy   -> red. This is the §1 trap: a missing or mistyped
#                             gating variable makes the plan propose deleting
#                             ~75 Zitadel resources, production orgs included.
#                             Nothing else in this repo warns you.
#   adds / updates only    -> GREEN, with the summary in the log.
#   no changes             -> green.
#
# Adds and updates are deliberately not failures. This repo carries standing
# drift by design — `gcloud run services update` changes, committed-but-not-yet
# -applied work — so failing on "plan is non-empty" would leave the build
# permanently red, and a permanently red build is one nobody reads.
#
# Plans run with -lock=false. A plan only reads state, and taking the lock would
# mean a long human apply turns this build red for no reason. The cost is that a
# plan captured mid-apply may be stale; the next push re-runs it.

timeout: 1800s

substitutions:
  # Project numbers for the environment projects, in the order multi-shared
  # expects. Source: docs/zitadel-and-terraform-variables.md §8.
  #
  # Referenced below as ${_ENV_PROJECT_NUMBERS} — a single $, so Cloud Build
  # substitutes it. Secret env vars use $$ instead, which escapes to a literal
  # $ and defers to the shell. Getting the two mixed up fails the build at
  # validation ("key ... is not matched in the template") rather than at run
  # time, which is the good outcome.
  _ENV_PROJECT_NUMBERS: '["815682864674","400245265670","375280996820"]'
  _TF_VERSION: '1.15.8'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

availableSecrets:
  secretManager:
    # NOTE: unifeed-zitadel-terraform-key, NOT zitadel-service-account-key.
    # The latter is the legacy Breathe-era key and fails with a generic
    # HTTP 500 Errors.Internal that reads like a broken server (docs §3).
    - versionName: projects/breathe-shared/secrets/unifeed-zitadel-terraform-key/versions/latest
      env: 'ZITADEL_KEY'
    - versionName: projects/breathe-shared/secrets/unifeed-cloudflare-api-token/versions/latest
      env: 'UNIFEED_CF_TOKEN'
    - versionName: projects/breathe-shared/secrets/cloudflare-api-token/versions/latest
      env: 'CF_TOKEN'

steps:
  # ---------------------------------------------------------------------------
  # The Zitadel provider authenticates from a JSON key file on disk, so the
  # secret has to be materialised rather than passed as a variable.
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'materialise-zitadel-key'
    entrypoint: 'bash'
    secretEnv: ['ZITADEL_KEY']
    args:
      - '-c'
      - |
        set -euo pipefail
        umask 077
        printf '%s' "$$ZITADEL_KEY" > /workspace/zitadel-key.json
        # Fail early and legibly if the key is not valid JSON — an expired or
        # rotated secret otherwise surfaces as an opaque provider error deep in
        # the refresh.
        python3 -c "import json;json.load(open('/workspace/zitadel-key.json'))"
        echo "Zitadel key materialised ($(wc -c < /workspace/zitadel-key.json) bytes)"

  - name: 'hashicorp/terraform:${_TF_VERSION}'
    id: 'plan-multi-shared'
    entrypoint: 'sh'
    secretEnv: ['UNIFEED_CF_TOKEN', 'CF_TOKEN']
    args:
      - '-c'
      - |
        set -eu
        cd environments/multi-shared
        terraform init -input=false -no-color
        # unifeed_zitadel_manage_config is passed explicitly even though it now
        # defaults to true: the §1 trap was a *partial* invocation, and being
        # explicit here means the pipeline cannot drift into that shape.
        terraform plan -input=false -no-color -lock=false \
          -out=/workspace/multi-shared.tfplan \
          -var 'environment_project_numbers=${_ENV_PROJECT_NUMBERS}' \
          -var 'unifeed_zitadel_manage_config=true' \
          -var 'unifeed_zitadel_key_path=/workspace/zitadel-key.json' \
          -var "unifeed_cloudflare_api_token=$$UNIFEED_CF_TOKEN" \
          -var "cloudflare_api_token=$$CF_TOKEN"
        terraform show -json /workspace/multi-shared.tfplan > /workspace/multi-shared.json

  - name: 'hashicorp/terraform:${_TF_VERSION}'
    id: 'plan-multi-dev'
    entrypoint: 'sh'
    secretEnv: ['UNIFEED_CF_TOKEN', 'CF_TOKEN']
    args:
      - '-c'
      - |
        set -eu
        cd environments/multi-dev
        terraform init -input=false -no-color
        # multi-dev's only two variables without defaults. terraform.tfvars is
        # gitignored and terraform.tfvars.example is stale (it names breathe-db;
        # the live instance is breathe-multi-db), so these are passed directly.
        terraform plan -input=false -no-color -lock=false \
          -out=/workspace/multi-dev.tfplan \
          -var 'vpc_connector_id=projects/breathe-shared/locations/europe-west2/connectors/breathe-vpc-connector' \
          -var 'db_connection_name=breathe-shared:europe-west2:breathe-multi-db' \
          -var "unifeed_cloudflare_api_token=$$UNIFEED_CF_TOKEN" \
          -var "cloudflare_api_token=$$CF_TOKEN"
        terraform show -json /workspace/multi-dev.tfplan > /workspace/multi-dev.json

  # ---------------------------------------------------------------------------
  # The gate. Summarise both plans and fail only on proposed destroys.
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'gate-on-destroys'
    entrypoint: 'python3'
    args:
      - '-c'
      - |
        import json, sys

        failed = False
        for env in ("multi-shared", "multi-dev"):
            with open("/workspace/%s.json" % env) as fh:
                plan = json.load(fh)

            create = update = delete = replace = 0
            destroyed = []
            for rc in plan.get("resource_changes", []):
                actions = rc.get("change", {}).get("actions", [])
                if actions == ["create"]:
                    create += 1
                elif actions == ["update"]:
                    update += 1
                elif actions == ["delete"]:
                    delete += 1
                    destroyed.append(rc["address"])
                elif "delete" in actions and "create" in actions:
                    replace += 1
                    destroyed.append(rc["address"] + " (replace)")

            print("%s: +%d ~%d -%d replace:%d"
                  % (env, create, update, delete, replace))

            if destroyed:
                failed = True
                print("  %d resource(s) would be destroyed:" % len(destroyed))
                for addr in destroyed:
                    print("    - " + addr)
                if any(".unifeed_zitadel_config" in a for a in destroyed):
                    print("  !! Destroys under module.unifeed_zitadel_config are")
                    print("     the signature of a missing or mistyped gating")
                    print("     variable, not a real change. See docs §1 before")
                    print("     applying anything.")

        if failed:
            print("\nFAILED: this plan proposes destroying resources.")
            sys.exit(1)
        print("\nOK: no destroys proposed.")

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'shred-key'
    entrypoint: 'bash'
    args: ['-c', 'shred -u /workspace/zitadel-key.json 2>/dev/null || rm -f /workspace/zitadel-key.json; echo done']

# Deliberately no `artifacts:` block. `terraform show -json` embeds the values
# of sensitive attributes, and 15 google_secret_manager_secret_version resources
# are Terraform-managed in multi-shared — so persisting the plan JSON would
# write secret material to durable storage. The plan files stay in the build
# workspace and die with it; the log summary is what survives.
